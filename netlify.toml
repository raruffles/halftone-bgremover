[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/api/ai/process"
  to = "/.netlify/functions/ai-process"
  status = 200

[[redirects]]
  from = "/api/ai/remove-bg"
  to = "/.netlify/functions/ai-remove-bg"
  status = 200

[[redirects]]
  from = "/api/ai/upscale"
  to = "/.netlify/functions/ai-upscale"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
